<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="style.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WYVRN Policy Actions</title>

<style>

.card{
background:#111827;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

button{
padding:12px 18px;
margin-right:10px;
margin-top:15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.block{
background:#dc2626;
color:white;
}

.limit{
background:#f59e0b;
color:white;
}

.mfa{
background:#2563eb;
color:white;
}

.result{
margin-top:20px;
padding:15px;
background:#1f2937;
border-radius:10px;
display:none;
}

button:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="layout">

<aside class="sidebar">

    <div class="logo">
        <h1>WYVRN</h1>
        <span>API Security Control Plane</span>
    </div>

    <nav>

        <a href="dashboard.html">Dashboard</a>

        <a href="endpoints.html">Endpoints</a>

        <a href="threat-monitor.html">Threat Monitor</a>

        <a href="alerts.html">Alerts</a>

        <a href="policies.html" class="active">Policies</a>

        <a href="analytics.html">Analytics</a>

        <a href="settings.html">Settings</a>

        <a href="#" onclick="logout()">Logout</a>

    </nav>

</aside>

<main class="main-content">

<h1>Policy Response Center</h1>

<div class="card">

<h3>GET /api/admin</h3>

<p>Critical Privilege Escalation Risk Detected</p>

<button class="block" onclick="takeAction('Endpoint Blocked')">
Block Endpoint
</button>

<button class="limit" onclick="takeAction('Rate Limiting Enabled')">
Enable Rate Limit
</button>

<button class="mfa" onclick="takeAction('MFA Enforcement Enabled')">
Require MFA
</button>

<div id="result" class="result"></div>

</div>

<div class="card">

<h3>POST /api/login</h3>

<p>Brute Force Activity Detected</p>

<button class="block" onclick="takeAction('Login Endpoint Temporarily Blocked')">
Block Endpoint
</button>

<button class="limit" onclick="takeAction('Rate Limiting Applied')">
Enable Rate Limit
</button>

<button class="mfa" onclick="takeAction('Step-up Authentication Enabled')">
Require MFA
</button>

</div>

</main>

</div>

<script>

function takeAction(action){

const result =
document.getElementById("result");

result.style.display = "block";

result.innerHTML =
"✅ Action Executed: " + action;

}

</script>
<script>
function logout() {
    localStorage.removeItem("wyvrnRole");
    window.location.href = "login.html";
}
</script>
</body>
</html>
