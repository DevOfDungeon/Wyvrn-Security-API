<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WYVRN — Security Command</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app-shell">

    <!-- =========================================================
         DECORATIVE ELEMENTS
    ========================================================== -->

    <div class="grain"></div>

    <div class="confetti confetti-1"></div>
    <div class="confetti confetti-2"></div>
    <div class="confetti confetti-3"></div>
    <div class="confetti confetti-4"></div>

    <!-- =========================================================
         NAVIGATION
    ========================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                W
            </div>

            <div>
                <div class="brand-name">WYVRN</div>
                <div class="brand-subtitle">SECURITY COMMAND</div>
            </div>

        </div>

        <div class="connection">

            <span class="connection-dot"></span>

            <span id="connectionText">
                LIVE
            </span>

        </div>

    </header>

<!-- =========================================================
         HERO
    ========================================================== -->

    <section class="hero">
            <span>
                PROTECTION ACTIVE
            </span>

        </div>

    </section>

    <!-- =========================================================
         RISK CARD
    ========================================================== -->

    <section class="risk-card">

        <div class="risk-card-top">

            <div>
                <div class="eyebrow">
                    CURRENT THREAT LEVEL
                </div>

                <div
                    class="risk-level"
                    id="riskLevel"
                >
                    LOW
                </div>
            </div>

            <div class="risk-number">
                <span id="riskScore">0</span>
                <small>/100</small>
            </div>

        </div>

        <div class="risk-bar">

            <div
                id="riskBar"
                class="risk-bar-fill"
            ></div>

        </div>

        <div class="risk-footer">

            <span>
                LIVE SECURITY SCORE
            </span>

            <span id="lastUpdated">
                JUST NOW
            </span>

        </div>

    </section>
